<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b1622">
  <title>デザインアーカイブ | ゆるいむくん</title>
  <meta name="description" content="ゆるいむくん公式サイトで過去に使っていたデザインの保存版を置いています。">
  <link rel="canonical" href="https://yuruimukun.com/portfolio/">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1b1622;
      --panel: #262031;
      --text: #f1e9f2;
      --muted: #a99db4;
      --accent: #ffb3c6;
      --border: #3a3247;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 3rem 1.25rem 4rem;
      background: var(--bg);
      color: var(--text);
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
      line-height: 1.9;
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    .kicker {
      margin: 0 0 0.4rem;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: var(--accent);
    }

    h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }

    .lead { margin: 0 0 2.5rem; color: var(--muted); font-size: 0.92rem; }

    .archive-card {
      display: block;
      padding: 1.5rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .archive-card:hover,
    .archive-card:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .archive-card h2 { margin: 0 0 0.5rem; font-size: 1.1rem; }

    .archive-period {
      margin: 0 0 0.75rem;
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .archive-card p { margin: 0 0 0.75rem; font-size: 0.88rem; color: var(--muted); }

    .archive-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0; padding: 0; list-style: none; }

    .archive-tags li {
      padding: 0.15rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .back {
      display: inline-block;
      margin-top: 2.5rem;
      color: var(--accent);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <p class="kicker">DESIGN ARCHIVE</p>
    <h1>サイトデザインの保存版</h1>
    <p class="lead">
      ゆるいむくん公式サイトで過去に使っていたデザインを、動く状態のまま保存しています。
      表示確認のため楽曲は数曲だけ収録しており、再生数の集計は行いません。
    </p>

    <a class="archive-card" href="/portfolio/2026-bgm-site/">
      <h2>BGMサイト版トップページ</h2>
      <p class="archive-period">2026年 〜 2026年9月</p>
      <p>
        「作業用BGM・睡眠用BGM」を主軸に、用途別の入口とプレイヤーガイドを厚めに置いた構成。
        期間限定BGM、ジャンル絞り込み、4種類のリスト切替を備えていました。
      </p>
      <ul class="archive-tags">
        <li>HLS ストリーミング</li>
        <li>ジャンルフィルタ</li>
        <li>用途別導線</li>
        <li>収録2曲</li>
      </ul>
    </a>

    <a class="back" href="/">← 現在の公式サイトへ</a>
  </div>
</body>

</html>
